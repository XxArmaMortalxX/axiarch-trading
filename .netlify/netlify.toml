functionsDirectory = "/Users/apple/axiarch-trading/netlify/functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
plugins = []

[build]
publish = "/Users/apple/axiarch-trading/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/Users/apple/axiarch-trading/netlify/functions"

[build.environment]
SECRETS_SCAN_OMIT_PATHS = "netlify/functions/telegram-daily.js,netlify/functions/telegram-test.js"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[functions]

[functions.telegram-daily]
schedule = "0 13 * * 1-5"

[functions.morning-scan]
schedule = "30 13 * * 1-5"

[functions.afternoon-check]
schedule = "0 20 * * 1-5"

[functions."*"]
node_bundler = "esbuild"

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/picks.json"

[headers.values]
Cache-Control = "public, max-age=3600"
Access-Control-Allow-Origin = "*"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]