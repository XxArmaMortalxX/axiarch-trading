[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  environment = { SECRETS_SCAN_OMIT_PATHS = "netlify/functions/telegram-daily.js,netlify/functions/telegram-test.js" }

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/picks.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[functions]
  node_bundler = "esbuild"

# Daily picks to Telegram — 8:00 AM ET (13:00 UTC) Mon-Fri
[functions."telegram-daily"]
  schedule = "0 13 * * 1-5"

# Morning scan — 10:00 AM ET (14:00 UTC) Mon-Fri
# Delayed 30min from open to let gap volatility settle
[functions."morning-scan"]
  schedule = "0 14 * * 1-5"

# Afternoon check — 4:00 PM ET (20:00 UTC) Mon-Fri
# Gets close prices for morning picks, calculates returns, saves to history
[functions."afternoon-check"]
  schedule = "0 20 * * 1-5"

# Daily email newsletter — 8:15 AM ET (12:15 UTC) Mon-Fri
# Sends morning picks to all email subscribers via Resend
[functions."daily-email"]
  schedule = "15 12 * * 1-5"

# Drip email check — 10:00 AM ET (14:00 UTC) daily
# Sends day-3 and day-7 follow-up emails to subscribers
[functions."welcome-email"]
  schedule = "0 14 * * *"

# Weekly recap — Sunday 9:00 AM ET (13:00 UTC)
[functions."weekly-recap"]
  schedule = "0 13 * * 0"
