<!-- Method 4: Simple Visitor Counter (Free) -->
<script>
// Simple visitor counter using a free service
(function() {
  // Track page view
  fetch('https://api.countapi.xyz/hit/axiarchtrading/visits')
    .then(res => res.json())
    .then(data => {
      console.log('Total visits:', data.value);
      // Optional: Display counter on page
      const counter = document.getElementById('visitor-counter');
      if (counter) {
        counter.textContent = data.value + ' traders served';
      }
    });
})();
</script>
