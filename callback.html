<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axiarch — Authenticating...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Outfit', sans-serif;
    background: #06080c;
    color: #e8ecf4;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #0f1420;
    border: 1px solid #1e2a3e;
    border-radius: 14px;
    padding: 3rem;
    text-align: center;
    max-width: 440px;
    width: 90%;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid #1e2a3e;
    border-top-color: #00e87b;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 1.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
  p { color: #8892a8; font-size: 0.9rem; line-height: 1.5; }
  .success { color: #00e87b; }
  .error { color: #ff3b5c; }
  a { color: #00d4ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Authenticating...</h1>
  <p id="message">Connecting to Finnhub and saving your credentials.</p>
</div>

<script>
(function handleCallback() {
  const params = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.substring(1));

  const token = params.get('access_token') || hash.get('access_token');
  const code = params.get('code');
  const error = params.get('error');

  const spinner = document.getElementById('spinner');
  const title = document.getElementById('title');
  const message = document.getElementById('message');

  if (error) {
    spinner.style.display = 'none';
    title.textContent = 'Authentication Failed';
    title.classList.add('error');
    message.innerHTML = 'Error: ' + error + '<br><br><a href="/">Back to Axiarch</a>';
    return;
  }

  if (token) {
    localStorage.setItem('finnhub_key', token);
    localStorage.setItem('finnhub_auth_method', 'oauth');
    spinner.style.display = 'none';
    title.textContent = 'Connected!';
    title.classList.add('success');
    message.innerHTML = 'Redirecting to Axiarch screener...';
    setTimeout(function() { window.location.href = '/#screener'; }, 1200);
    return;
  }

  if (code) {
    localStorage.setItem('finnhub_auth_code', code);
    localStorage.setItem('finnhub_auth_method', 'oauth_code');
    spinner.style.display = 'none';
    title.textContent = 'Authorization Code Received';
    title.classList.add('success');
    message.innerHTML = 'Code saved. Redirecting...<br><br><a href="/#screener">Go to Screener</a>';
    setTimeout(function() { window.location.href = '/#screener'; }, 2000);
    return;
  }

  // Check hash fragment for implicit grant
  if (window.location.hash) {
    var hashParams = new URLSearchParams(window.location.hash.replace('#', ''));
    var hashToken = hashParams.get('access_token') || hashParams.get('token');
    if (hashToken) {
      localStorage.setItem('finnhub_key', hashToken);
      localStorage.setItem('finnhub_auth_method', 'oauth');
      spinner.style.display = 'none';
      title.textContent = 'Connected!';
      title.classList.add('success');
      message.innerHTML = 'Redirecting to Axiarch screener...';
      setTimeout(function() { window.location.href = '/#screener'; }, 1200);
      return;
    }
  }

  // Nothing found
  spinner.style.display = 'none';
  title.textContent = 'No Credentials Found';
  title.classList.add('error');
  message.innerHTML = 'No access token was returned.<br><br>You can still enter your API key manually on the <a href="/#screener">screener page</a>.';
})();
</script>
</body>
</html>
